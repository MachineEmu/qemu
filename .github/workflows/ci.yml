name: machineemu-qemu

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install display-stream build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Check track inputs
        run: |
          python scripts/check_track.py tracks/unifi-10.2
          python scripts/check_track.py tracks/analysis-10.2
      - name: Test bundle validator
        run: python -m pytest -q tests/test_engine_bundle.py
