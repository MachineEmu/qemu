[package]
name = "spice-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport-independent SPICE audio codec with a live probe and a fake server"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
rsa.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[[bin]]
name = "spice-audio-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "spice-audio-fake-server"
path = "src/bin/fake_server.rs"

[[bin]]
name = "spice-audio-fixtures"
path = "src/bin/fixtures.rs"
